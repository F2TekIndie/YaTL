name: Verify Fedora
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 15
    steps:
      - name: Install build dependencies
        run: dnf install -y git gcc-c++ make python3 qt6-qtbase-devel qt6-qtdeclarative-devel libglvnd-devel
      - uses: actions/checkout@v4
      - name: Build and verify the complete loop
        env:
          QMAKE: /usr/bin/qmake6
        run: ./scripts/verify.sh
